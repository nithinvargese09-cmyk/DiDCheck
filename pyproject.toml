[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "didcheck"
version = "0.1.0"
description = "Full temporal covariance and centered bootstrap diagnostics for pretreatment variance restrictions"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
  {name = "Aditya Alaparti"},
  {name = "Amann Katta"},
  {name = "Nithin Vargese"},
  {name = "Swaraj Sainani"},
]
keywords = ["econometrics", "difference-in-differences", "pretrends", "bootstrap", "panel-data"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<4", "matplotlib>=3.7,<4"]

[project.urls]
"Homepage" = "https://github.com/nithinvargese09-cmyk/DiDCheck"
"Source" = "https://github.com/nithinvargese09-cmyk/DiDCheck"
"Issues" = "https://github.com/nithinvargese09-cmyk/DiDCheck/issues"
"Documentation" = "https://github.com/nithinvargese09-cmyk/DiDCheck/tree/main/docs"
"Research preprint" = "https://doi.org/10.5281/zenodo.23328869"

[project.optional-dependencies]
test = ["pytest>=7,<10"]
dev = ["pytest>=7,<10", "build>=1.2", "twine>=6", "PyYAML>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
didcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

